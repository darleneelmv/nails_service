# Plan gratis: sin disco. Los datos se reinician cuando Render duerme o reinicia el servicio
# (ideal para demo). Para uso real cambia plan a "starter" y descomenta el disco.
services:
  - type: web
    name: nails-service
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/public/starlight-studio
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@brillo.app
    # disk:
    #   name: brillo-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (y agrega DATA_DIR=/var/data en envVars)
